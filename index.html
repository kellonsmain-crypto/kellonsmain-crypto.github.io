<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PictureWorld — real moments, not posed ones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f0f0f;
    --bg-panel: #181818;
    --paper: #1c1c1c;
    --cream: #ededed;
    --honey: #ff9000;
    --honey-dim: #cc7300;
    --brick: #ff9000;
    --line: rgba(255,255,255,0.09);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 900px 460px at 15% -8%, rgba(255,144,0,0.16), transparent 60%),
      radial-gradient(ellipse 700px 460px at 100% 5%, rgba(255,144,0,0.08), transparent 55%);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--honey); color:#0f0f0f; }
  a{ color:inherit; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1180px; margin:0 auto; padding:28px 28px 0;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
  }
  .wordmark{ font-family:'Oswald', sans-serif; font-size:24px; font-weight:600; letter-spacing:0.3px; text-transform:uppercase; }
  .wordmark em{ font-style:normal; color:var(--honey); font-weight:700; }

  .hero{ max-width:1180px; margin:0 auto; padding:56px 28px 30px; }
  .hero h1{
    font-family:'Oswald', sans-serif; font-weight:600; text-transform:uppercase;
    font-size:clamp(32px, 4.6vw, 52px); line-height:1.08; letter-spacing:0.3px;
    margin:0 0 16px; max-width:16ch;
  }
  .hero h1 i{ font-style:normal; font-weight:700; color:var(--honey); }
  .hero p{ font-size:16.5px; line-height:1.6; max-width:50ch; opacity:0.75; margin:0; }

  .gallery-section{ max-width:1180px; margin:0 auto; padding:20px 28px 100px; }
  .gallery-heading{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:26px; border-bottom:1px solid var(--line); padding-bottom:14px;
  }
  .gallery-heading h2{ font-family:'Oswald', sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; font-size:22px; margin:0; }
  .gallery-count{ font-size:14px; opacity:0.55; }

  .empty-state{ text-align:center; padding:70px 20px; opacity:0.55; font-size:15px; }
  .empty-state span{ display:block; font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:20px; color:var(--honey); opacity:1; margin-bottom:8px; }

  .wall{ column-count:4; column-gap:26px; }
  @media (max-width:1000px){ .wall{ column-count:3; } }
  @media (max-width:720px){ .wall{ column-count:2; } }
  @media (max-width:480px){ .wall{ column-count:1; } }

  .frame{
    break-inside:avoid; margin-bottom:26px; background:var(--paper);
    padding:0 0 40px; border-radius:4px; overflow:hidden;
    box-shadow:0 10px 22px rgba(0,0,0,0.5);
    border:1px solid var(--line);
    position:relative; cursor:zoom-in;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .frame:hover{ transform:translateY(-4px); box-shadow:0 16px 32px rgba(255,144,0,0.14); border-color:var(--honey); }
  .frame img{ display:block; width:100%; background:rgba(255,255,255,0.03); min-height:60px; }
  .frame .cap{
    position:absolute; left:14px; right:14px; bottom:13px;
    font-family:'Work Sans', sans-serif; font-weight:500; font-size:13px;
    color:var(--cream); opacity:0.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .frame::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:40px;
    background:linear-gradient(to top, rgba(0,0,0,0.55), transparent);
    pointer-events:none;
  }

  .lightbox{
    position:fixed; inset:0; background:rgba(15,11,7,0.92);
    display:none; align-items:center; justify-content:center; z-index:100; padding:40px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:90vw; max-height:82vh; border-radius:3px; box-shadow:0 30px 60px rgba(0,0,0,0.5); }
  .lightbox .close, .lightbox .nav{
    position:absolute; background:rgba(244,234,217,0.08); border:1px solid var(--line);
    color:var(--cream); border-radius:50%; cursor:pointer; transition:background .2s ease;
  }
  .lightbox .close:hover, .lightbox .nav:hover{ background:rgba(244,234,217,0.18); }
  .lightbox .close{ top:24px; right:28px; width:42px; height:42px; font-size:18px; }
  .lightbox .nav{ top:50%; transform:translateY(-50%); width:48px; height:48px; font-size:20px; }
  .lightbox .prev{ left:24px; }
  .lightbox .next{ right:24px; }
  .lightbox .lb-cap{
    position:absolute; bottom:26px; left:0; right:0; text-align:center;
    font-family:'Work Sans', sans-serif; font-weight:500; font-size:15px; color:var(--cream); opacity:0.75;
  }

  footer{ text-align:center; padding:36px 20px 50px; font-size:13px; opacity:0.4; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

  <div class="topbar">
    <div class="wordmark">Picture<em>World</em></div>
  </div>

  <section class="hero">
    <h1>Real Candids <i>Best angles.</i></h1>
    <p>PictureWorld is a wall for the best candid moments that show the best of girls.</p>
  </section>

  <section class="gallery-section">
    <div class="gallery-heading">
      <h2>The wall</h2>
      <div class="gallery-count" id="galleryCount">0 pictures</div>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;"><span>Nothing here yet</span>add a photo down in the code</div>
    <div class="wall" id="wall-grid"></div>
  </section>

  <footer>PictureWorld — made for the moments we really want to see.</footer>

  <div class="lightbox" id="lightbox">
    <button class="close" id="lbClose">✕</button>
    <button class="nav prev" id="lbPrev">‹</button>
    <img id="lbImg" src="" alt="">
    <button class="nav next" id="lbNext">›</button>
    <div class="lb-cap" id="lbCap"></div>
  </div>

<script>
  /* ========================================================
     ADD YOUR PHOTOS HERE
     One line per photo: { url: "...", caption: "..." }
     Get the url from Discord: right-click the image in your
     server → "Copy Image Address" → paste it as the url below.
     Newest photo at the top shows up first on the wall.
     Don't forget the comma at the end of each line except the last.
  ======================================================== */
  const PHOTOS = [
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548363965623701566/image.png?ex=6aa77290&is=6aa62110&hm=f190033338a4a4cb98f36573924f8222e06b392d4ca1da49df955efa9dc7f8ab&", caption: "Theme Park" },
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548364074092331220/image.png?ex=6aa772aa&is=6aa6212a&hm=ce97f016d9593cea342bff1a30f91d3b39a15995592ef0b4612e9a71fd020dd7&", caption: "Theme Park" },
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548364195375091853/image.png?ex=6aa772c7&is=6aa62147&hm=0a0f5ae88fe5ee46cd7ba1474bab6854b8faf51b7018500565acd982be5b9d59&", caption: "Lets get closer" },
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548364287595257876/image.png?ex=6aa772dd&is=6aa6215d&hm=ae0156d5fe243c4e36d9dd51adc54e381065a39aad50c8a53f67000ab42cb10f&", caption: "The earth is round"},
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548364358311215206/image.png?ex=6aa772ee&is=6aa6216e&hm=6ca7f0f351b44f56c1e6193366700c19cb77a89ccd5733fb34b2d4303bbc9a3f&", caption: "Too tight?"},
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548364516868497528/image.png?ex=6aa77314&is=6aa62194&hm=9b4b7ec6eab164511b071f9108fbcafdc4e0a828900c905a074cc35a3ff7684f&", caption: "Emo Sluts"},
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548364583440351303/image.png?ex=6aa77323&is=6aa621a3&hm=10262edd844b4b95acd25dffcb5b31cc5311050eed63a603397990d91e00087c&", caption: "Cheeked up with dad"},
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548364785639497798/image.png?ex=6aa77354&is=6aa621d4&hm=09f8e580fdeaaee64bf561de08bb39e3200d0cf746f4299d15257d5ceb811b21&", caption: "Blue spandex"},
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548364871366868992/image.png?ex=6aa77368&is=6aa621e8&hm=0dedda636e224c144980e998619e7ab83747377438f2040ed4d6d5a09d313d5c&", caption: "No words needed here"},
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548713366443266048/image.png?ex=6aa80f38&is=6aa6bdb8&hm=dba4fdc24a325f01b24543aa19b32a0fb0b66cf59459d5b47ca62c78aac7970b&", caption: "alright we're dreaming"},
    { url: "https://cdn.discordapp.com/attachments/1546598981604347974/1548713433577427034/image.png?ex=6aa80f48&is=6aa6bdc8&hm=2f172eebf2095351c28f65ef34fc9e405b6dc14f4eece3944dbf616160ccfbe8&", caption: "dreaming part 2"},
    { url: "https://files.forum.candidgirls.io/original/4X/2/0/6/206e6f76d76d8e56feafb65e19174ec3270ecc46.gif", caption: ""},
    { url: "https://www.redgifs.com/watch/discretegiftedanole", caption: ""},

    { url: "", caption: ""},

  ];
  /* ======================================================== */

  const wallGrid = document.getElementById('wall-grid');
  const emptyState = document.getElementById('emptyState');
  const galleryCount = document.getElementById('galleryCount');

  function renderWall(){
    wallGrid.innerHTML = '';
    PHOTOS.forEach((photo, i) => {
      const frame = document.createElement('div');
      frame.className = 'frame';

      const img = document.createElement('img');
      img.src = photo.url;
      img.alt = photo.caption || '';
      img.loading = 'lazy';
      img.addEventListener('click', () => openLightbox(i));

      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = photo.caption || '';

      frame.appendChild(img);
      frame.appendChild(cap);
      wallGrid.appendChild(frame);
    });

    emptyState.style.display = PHOTOS.length ? 'none' : 'block';
    galleryCount.textContent = PHOTOS.length + (PHOTOS.length === 1 ? ' picture' : ' pictures');
  }

  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCap = document.getElementById('lbCap');
  let currentIndex = 0;

  function openLightbox(i){ currentIndex = i; updateLightbox(); lightbox.classList.add('open'); }
  function updateLightbox(){ lbImg.src = PHOTOS[currentIndex].url; lbCap.textContent = PHOTOS[currentIndex].caption || ''; }
  function closeLightbox(){ lightbox.classList.remove('open'); }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbNext').addEventListener('click', () => { currentIndex = (currentIndex+1)%PHOTOS.length; updateLightbox(); });
  document.getElementById('lbPrev').addEventListener('click', () => { currentIndex = (currentIndex-1+PHOTOS.length)%PHOTOS.length; updateLightbox(); });
  lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') document.getElementById('lbNext').click();
    if(e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
  });

  renderWall();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ScrollFeed</title>

<style>

    /* =========================================================
       EASY EDIT SETTINGS
       ========================================================= */

    :root {
        --background: #000;
        --text: #fff;
        --accent: #ff0050;
        --secondary: #00f2ea;
    }


    /* =========================================================
       RESET
       ========================================================= */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--background);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================================================
       APP
       ========================================================= */

    #app {
        width: 100%;
        height: 100dvh;
        background: #000;
        position: relative;
    }


    /* =========================================================
       FEED
       ========================================================= */

    #feed {
        width: 100%;
        height: 100dvh;

        overflow-y: auto;

        scroll-snap-type: y mandatory;

        scrollbar-width: none;
    }

    #feed::-webkit-scrollbar {
        display: none;
    }


    /* =========================================================
       VIDEO
       ========================================================= */

    .video-card {
        width: 100%;
        height: 100dvh;

        position: relative;

        scroll-snap-align: start;

        background: #111;

        overflow: hidden;
    }

    .video {
        width: 100%;
        height: 100%;

        object-fit: cover;

        background: #111;

        cursor: pointer;
    }


    /* =========================================================
       DARK GRADIENT
       ========================================================= */

    .video-card::after {
        content: "";

        position: absolute;

        left: 0;
        right: 0;
        bottom: 0;

        height: 50%;

        pointer-events: none;

        background:
            linear-gradient(
                transparent,
                rgba(0,0,0,.85)
            );
    }


    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
        position: fixed;

        z-index: 100;

        top: 0;
        left: 0;
        right: 0;

        height: 70px;

        display: flex;

        justify-content: center;
        align-items: center;

        pointer-events: none;

        background:
            linear-gradient(
                rgba(0,0,0,.55),
                transparent
            );
    }

    .logo {
        font-size: 25px;

        font-weight: 900;

        letter-spacing: -1px;

        text-shadow:
            2px 2px var(--accent),
            -2px -2px var(--secondary);
    }


    /* =========================================================
       VIDEO INFORMATION
       ========================================================= */

    .info {
        position: absolute;

        z-index: 20;

        left: 18px;
        right: 90px;
        bottom: 30px;
    }

    .username {
        font-weight: 800;

        font-size: 17px;

        margin-bottom: 8px;
    }

    .description {
        font-size: 15px;

        line-height: 1.4;

        margin-bottom: 10px;
    }

    .source {
        font-size: 12px;

        color: #bbb;
    }


    /* =========================================================
       ACTION BUTTONS
       ========================================================= */

    .actions {
        position: absolute;

        z-index: 30;

        right: 12px;
        bottom: 30px;

        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 18px;
    }

    button {
        font-family: inherit;
    }

    .action {
        border: 0;

        background: transparent;

        color: white;

        cursor: pointer;

        display: flex;

        flex-direction: column;

        align-items: center;

        font-size: 12px;

        font-weight: bold;
    }

    .action-icon {
        width: 50px;
        height: 50px;

        display: grid;

        place-items: center;

        border-radius: 50%;

        background: rgba(255,255,255,.13);

        backdrop-filter: blur(10px);

        font-size: 22px;

        margin-bottom: 4px;
    }

    .liked .action-icon {
        color: var(--accent);
    }


    /* =========================================================
       PLAY ICON
       ========================================================= */

    .play {
        position: absolute;

        z-index: 15;

        inset: 0;

        display: grid;

        place-items: center;

        pointer-events: none;

        opacity: 0;

        transition: opacity .2s;
    }

    .play.show {
        opacity: 1;
    }

    .play span {
        width: 75px;
        height: 75px;

        border-radius: 50%;

        display: grid;

        place-items: center;

        background: rgba(0,0,0,.6);

        font-size: 32px;
    }


    /* =========================================================
       LOADING
       ========================================================= */

    #loading {
        position: fixed;

        z-index: 500;

        inset: 0;

        background: #000;

        display: grid;

        place-items: center;
    }

    #loading.hidden {
        display: none;
    }

    .spinner {
        width: 45px;
        height: 45px;

        border: 4px solid #333;

        border-top-color: var(--accent);

        border-radius: 50%;

        animation: spin .8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }


    /* =========================================================
       LOAD MORE
       ========================================================= */

    #loadingMore {
        position: fixed;

        z-index: 400;

        bottom: 20px;

        left: 50%;

        transform: translateX(-50%);

        background: rgba(0,0,0,.65);

        padding: 8px 14px;

        border-radius: 20px;

        font-size: 12px;

        display: none;
    }


    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 700px) {

        #feed {
            width: 500px;

            margin: auto;

            box-shadow:
                0 0 80px rgba(0,0,0,.8);
        }

        .topbar {
            width: 500px;

            left: 50%;

            right: auto;

            transform: translateX(-50%);
        }
    }

</style>
</head>


<body>

<div id="app">

    <div id="loading">
        <div class="spinner"></div>
    </div>

    <header class="topbar">
        <div class="logo">
            ScrollFeed
        </div>
    </header>

    <main id="feed"></main>

    <div id="loadingMore">
        Loading more videos...
    </div>

</div>


<script>

/* ============================================================
   SCROLLFEED CONFIGURATION
   ============================================================ */

const CONFIG = {

    /*
       What Wikimedia Commons searches for.

       You can change these to things like:

       "cats"
       "dogs"
       "sports"
       "nature"
       "cars"
       "space"
       "ocean"
       "funny"
       "animation"

       The application randomly chooses one.
    */

    SEARCHES: [
        "doggystyle",
        "porn",
        "sex",
        "fucking",
        "girlsnude",
        "nakedgirls",
        "hotgirls",
        "girlsass",
        "girlsbutt"
    ],


    /*
       Number of videos fetched at once.
    */

    VIDEOS_PER_REQUEST: 20,


    /*
       Automatically load more when this many
       videos remain.
    */

    LOAD_MORE_WHEN_REMAINING: 5,


    /*
       Videos start muted because browsers normally
       block autoplay with sound.
    */

    MUTED: true,


    /*
       Automatically play the visible video.
    */

    AUTOPLAY: true

};


/* ============================================================
   DOM
   ============================================================ */

const feed = document.getElementById("feed");

const loading = document.getElementById("loading");

const loadingMore =
    document.getElementById("loadingMore");


/* ============================================================
   STATE
   ============================================================ */

let loadingVideos = false;

let loadedFiles = new Set();

let observer;


/* ============================================================
   RANDOM SEARCH
   ============================================================ */

function randomSearch() {

    const list = CONFIG.SEARCHES;

    return list[
        Math.floor(
            Math.random() * list.length
        )
    ];
}


/* ============================================================
   FETCH RANDOM VIDEOS FROM WIKIMEDIA COMMONS
   ============================================================ */

async function fetchVideos() {

    if (loadingVideos) return;

    loadingVideos = true;

    loadingMore.style.display = "block";


    try {

        const search = randomSearch();


        /*
           Wikimedia Commons API.

           "origin=*" allows browser-side CORS requests.
        */

        const url =
            "https://commons.wikimedia.org/w/api.php" +

            "?action=query" +

            "&generator=search" +

            "&gsrsearch=" +
            encodeURIComponent(
                search + " filetype:video"
            ) +

            "&gsrnamespace=6" +

            "&gsrlimit=" +
            CONFIG.VIDEOS_PER_REQUEST +

            "&prop=imageinfo" +

            "&iiprop=url|mime|size" +

            "&iiurlwidth=720" +

            "&format=json" +

            "&origin=*";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Wikimedia request failed"
            );

        }


        const data =
            await response.json();


        const pages =
            Object.values(
                data.query?.pages || {}
            );


        /*
           Shuffle results so the feed doesn't
           always appear in the same order.
        */

        shuffle(pages);


        let added = 0;


        for (const page of pages) {

            const info =
                page.imageinfo?.[0];


            if (!info) continue;


            const mime =
                info.mime || "";


            /*
               Only allow actual video formats.

               This is important because Wikimedia
               search can return images as well.
            */

            if (!mime.startsWith("video/")) {
                continue;
            }


            const videoURL =
                info.url;


            if (!videoURL) continue;


            /*
               Don't show the same file twice.
            */

            if (loadedFiles.has(videoURL)) {
                continue;
            }


            loadedFiles.add(videoURL);


            const card =
                createVideoCard({

                    url: videoURL,

                    title:
                        cleanTitle(
                            page.title
                        ),

                    source:
                        "Wikimedia Commons",

                    pageURL:
                        "https://commons.wikimedia.org/wiki/" +
                        encodeURIComponent(
                            page.title.replace(
                                "File:",
                                "File:"
                            )
                        )

                });


            feed.appendChild(card);


            added++;

        }


        /*
           If this particular search didn't
           produce usable videos, try again.
        */

        if (added === 0) {

            console.log(
                "No usable videos. Trying another search..."
            );

        }

    } catch (error) {

        console.error(
            "Could not load videos:",
            error
        );

        showError();

    }


    loadingVideos = false;

    loadingMore.style.display = "none";

}


/* ============================================================
   CREATE VIDEO CARD
   ============================================================ */

function createVideoCard(data) {

    const card =
        document.createElement("article");


    card.className =
        "video-card";


    card.innerHTML = `

        <video
            class="video"
            src="${escapeHTML(data.url)}"
            playsinline
            preload="metadata"
            ${CONFIG.MUTED ? "muted" : ""}
        ></video>


        <div class="play">

            <span>▶</span>

        </div>


        <div class="info">

            <div class="username">
                ScrollFeed
            </div>

            <div class="description">
                ${escapeHTML(data.title)}
            </div>

            <div class="source">
                🎬 ${escapeHTML(data.source)}
            </div>

        </div>


        <div class="actions">

            <button
                class="action like"
                title="Like"
            >

                <div class="action-icon">
                    ♡
                </div>

                <span>Like</span>

            </button>


            <button
                class="action share"
                title="Share"
            >

                <div class="action-icon">
                    ↗
                </div>

                <span>Share</span>

            </button>


            <button
                class="action mute"
                title="Sound"
            >

                <div class="action-icon">
                    🔇
                </div>

                <span>Sound</span>

            </button>


            <button
                class="action source-button"
                title="Open source"
            >

                <div class="action-icon">
                    ℹ
                </div>

                <span>Source</span>

            </button>

        </div>

    `;


    setupCard(card, data);


    return card;

}


/* ============================================================
   VIDEO CONTROLS
   ============================================================ */

function setupCard(card, data) {

    const video =
        card.querySelector(".video");


    const play =
        card.querySelector(".play");


    const like =
        card.querySelector(".like");


    const share =
        card.querySelector(".share");


    const mute =
        card.querySelector(".mute");


    const source =
        card.querySelector(".source-button");


    /* ---------------------------------------------------------
       PLAY / PAUSE
       --------------------------------------------------------- */

    video.addEventListener(
        "click",
        () => {

            if (video.paused) {

                video.play();

                play.classList.remove("show");

            } else {

                video.pause();

                play.classList.add("show");

            }

        }
    );


    /* ---------------------------------------------------------
       LIKE
       --------------------------------------------------------- */

    like.addEventListener(
        "click",
        () => {

            like.classList.toggle("liked");


            like.querySelector(
                ".action-icon"
            ).textContent =
                like.classList.contains("liked")
                    ? "♥"
                    : "♡";

        }
    );


    /* ---------------------------------------------------------
       MUTE
       --------------------------------------------------------- */

    mute.addEventListener(
        "click",
        () => {

            video.muted =
                !video.muted;


            mute.querySelector(
                ".action-icon"
            ).textContent =
                video.muted
                    ? "🔇"
                    : "🔊";

        }
    );


    /* ---------------------------------------------------------
       SHARE
       --------------------------------------------------------- */

    share.addEventListener(
        "click",
        async () => {

            try {

                if (navigator.share) {

                    await navigator.share({

                        title:
                            "ScrollFeed",

                        text:
                            data.title,

                        url:
                            data.pageURL

                    });

                } else {

                    await navigator.clipboard.writeText(
                        data.pageURL
                    );

                    alert(
                        "Source URL copied!"
                    );

                }

            } catch {

                console.log(
                    "Share cancelled."
                );

            }

        }
    );


    /* ---------------------------------------------------------
       SOURCE
       --------------------------------------------------------- */

    source.addEventListener(
        "click",
        () => {

            window.open(
                data.pageURL,
                "_blank",
                "noopener"
            );

        }
    );

}


/* ============================================================
   AUTOPLAY OBSERVER
   ============================================================ */

function setupObserver() {

    if (observer) {

        observer.disconnect();

    }


    observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(
                    entry => {

                        const video =
                            entry.target.querySelector(
                                ".video"
                            );


                        if (!video) return;


                        if (
                            entry.isIntersecting
                        ) {

                            if (
                                CONFIG.AUTOPLAY
                            ) {

                                video
                                    .play()
                                    .catch(
                                        () => {}
                                    );

                            }

                        } else {

                            video.pause();

                        }

                    }
                );

            },
            {
                threshold: 0.7
            }
        );


    document
        .querySelectorAll(".video-card")
        .forEach(card => {

            observer.observe(card);

        });

}


/* ============================================================
   INFINITE FEED
   ============================================================ */

feed.addEventListener(
    "scroll",
    async () => {

        const distanceFromBottom =
            feed.scrollHeight -
            feed.scrollTop -
            feed.clientHeight;


        /*
           When we're close to the bottom,
           automatically grab more.
        */

        if (
            distanceFromBottom <
            feed.clientHeight *
            CONFIG.LOAD_MORE_WHEN_REMAINING
        ) {

            await fetchVideos();

            setupObserver();

        }

    }
);


/* ============================================================
   RANDOMIZE ARRAY
   ============================================================ */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* ============================================================
   CLEAN WIKIMEDIA TITLE
   ============================================================ */

function cleanTitle(title) {

    return String(title || "")
        .replace(/^File:/, "")
        .replace(/\.[^/.]+$/, "")
        .replaceAll("_", " ");

}


/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ============================================================
   ERROR DISPLAY
   ============================================================ */

function showError() {

    if (feed.children.length > 0) {
        return;
    }


    feed.innerHTML = `

        <div style="
            height:100%;
            display:grid;
            place-items:center;
            text-align:center;
            padding:30px;
        ">

            <div>

                <h2>
                    Couldn't load videos
                </h2>

                <p style="
                    color:#aaa;
                    margin-top:10px;
                ">
                    Try refreshing ScrollFeed.
                </p>

            </div>

        </div>

    `;

}


/* ============================================================
   START
   ============================================================ */

async function start() {

    await fetchVideos();

    setupObserver();

    loading.classList.add(
        "hidden"
    );

}


/* ============================================================
   GO
   ============================================================ */

start();

</script>

</body>
</html>
